<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link href="css/stylesheet.css" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

  <style>
    .attribution { font-size: 12px; text-align: center; }
    .attribution a { color: hsl(240, 21%, 54%); }
  </style>
</head>
<body>
  <div class="card-layout">
    <div class="hero-image">
      <img src="assets/images/illustration-article.svg" alt="geometric balck yellow white design">
    </div>
    
    <h2>Learning</h2>

    <div class="text">

      <p>Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <div class="gray-text">
        <p>These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>
    </div>

    <div class="author">
      <img src="assets/images/image-avatar.webp" alt="photo of man author">
      <h3>Greg Hooper</h3>  
    </div>
  </div>
  <footer>
    <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Moon</a>.
    </div>
  </footer>

</html>
